name: Deploy Android OTA

on:
  workflow_dispatch:
  push:
    branches:
      - prod
    paths:
      - 'app/**'
      - 'assets/**'
      - 'public/**'
      - 'capacitor.config.json'
      - 'nuxt.config.ts'
      - 'package.json'
      - 'package-lock.json'

jobs:
  deploy-ota:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Zip and upload bundle to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CAPGO_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CAPGO_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: ${{ secrets.CAPGO_R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.CAPGO_R2_BUCKET_NAME }}
          PUBLIC_URL: ${{ secrets.CAPGO_R2_PUBLIC_URL }}
        run: |
          set -euo pipefail

          # Validate configuration
          : "${R2_ENDPOINT:?R2_ENDPOINT is empty}"
          : "${R2_BUCKET:?R2_BUCKET is empty}"
          : "${PUBLIC_URL:?CAPGO_R2_PUBLIC_URL is empty}"

          # Resolve build output directory
          WEB_DIR=$(node -p "require('./capacitor.config.json').webDir")

          if [[ ! -f "$WEB_DIR/index.html" ]]; then
            echo "Error: index.html not found in $WEB_DIR"
            exit 1
          fi

          # Generate a SemVer-compatible version
          VERSION="$(date +%Y.%-m.%-d)-${GITHUB_RUN_NUMBER}"

          ZIP_NAME="bundle-${VERSION}.zip"
          BASE="${PUBLIC_URL%/}"

          echo "Building bundle: $ZIP_NAME"

          # Package the web app
          (cd "$WEB_DIR" && zip -qr "$GITHUB_WORKSPACE/$ZIP_NAME" .)

          # Calculate SHA-256 of the exact ZIP being uploaded
          CHECKSUM=$(sha256sum "$ZIP_NAME" | awk '{print $1}')

          echo "Bundle checksum: $CHECKSUM"

          # Generate update metadata
          jq -n \
            --arg version "$VERSION" \
            --arg url "$BASE/$ZIP_NAME" \
            --arg checksum "$CHECKSUM" \
            '{
              version: $version,
              url: $url,
              checksum: $checksum
            }' > version.json

          echo "Generated version.json:"
          cat version.json

          # Upload bundle first
          aws s3 cp "$ZIP_NAME" "s3://$R2_BUCKET/$ZIP_NAME" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type application/zip

          # Publish metadata last, so clients never discover an incomplete bundle
          aws s3 cp version.json "s3://$R2_BUCKET/version.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type application/json \
            --cache-control "no-cache"

          echo "Deployment successful: $VERSION"

          # Optional: keep the newest 5 bundles
          # aws s3api list-objects-v2 \
          #   --bucket "$R2_BUCKET" \
          #   --prefix "bundle-" \
          #   --endpoint-url "$R2_ENDPOINT" \
          #   --query 'sort_by(Contents, &LastModified)[:-5].Key' \
          #   --output text \
          #   | tr '\t' '\n' \
          #   | grep '^bundle-' \
          #   | while read -r key; do
          #       aws s3 rm "s3://$R2_BUCKET/$key" \
          #         --endpoint-url "$R2_ENDPOINT"
          #     done
