name: Deploy OTA Production Update

on:
  workflow_dispatch:
  push:
    branches:
      - prod
    paths:
      - 'app/**'
      - 'assets/**'
      - 'public/**'
      - 'capacitor.config.json'
      - 'nuxt.config.ts'
      - 'package.json'
      - 'package-lock.json'

jobs:
  deploy-ota:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Diagnose R2 connection
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CAPGO_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CAPGO_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.CAPGO_R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.CAPGO_R2_BUCKET_NAME }}
        run: |
          aws --version

          echo "Checking bucket access..."
          aws s3api list-objects-v2 \
            --bucket "$R2_BUCKET" \
            --endpoint-url "$R2_ENDPOINT" \
            --max-keys 1

      - name: Build Web App
        run: npm run build

      - name: Zip and upload bundle to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CAPGO_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CAPGO_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          AWS_SIGV4_SIGN_OPTIONS: 'all'
          R2_ENDPOINT: ${{ secrets.CAPGO_R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.CAPGO_R2_BUCKET_NAME }}
          PUBLIC_URL: ${{ secrets.OTA_PUBLIC_URL }}
        run: |
          set -euo pipefail

          WEB_DIR=$(node -p "require('./capacitor.config.json').webDir")
          #VERSION="$(node -p "require('./package.json').version")-${GITHUB_RUN_NUMBER}"
          VERSION="$(date +%Y.%m.%d)-${GITHUB_RUN_NUMBER}"
          ZIP="bundle-${VERSION}.zip"
          BASE="${PUBLIC_URL%/}"

          (cd "$WEB_DIR" && zip -qr "$GITHUB_WORKSPACE/$ZIP" .)

          printf '{"version":"%s","url":"%s/%s"}\n' "$VERSION" "$BASE" "$ZIP" > version.json
          cat version.json

          # fix the "An error occurred (401) when calling the CreateMultipartUpload operation: Unauthorized" error
          aws configure set default.s3.multipart_threshold 100GB
          aws configure set default.s3.max_concurrent_requests 1

          # zip first, version.json last, so devices never see a version whose zip is missing
          aws s3 cp "$ZIP" "s3://$R2_BUCKET/$ZIP" --endpoint-url "$R2_ENDPOINT" --checksum-algorithm CRC32
          aws s3 cp version.json "s3://$R2_BUCKET/version.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type application/json \
            --cache-control "no-cache"

          # keep the newest 5 bundles, delete the rest (the latest is always among the kept ones)
          #aws s3api list-objects-v2 \
          #  --bucket "$R2_BUCKET" \
          #  --prefix "bundle-" \
          #  --endpoint-url "$R2_ENDPOINT" \
          #  --query 'sort_by(Contents, &LastModified)[:-5].Key' \
          #  --output text \
          #  | tr '\t' '\n' | grep '^bundle-' | while read -r key; do
          #      aws s3 rm "s3://$R2_BUCKET/$key" --endpoint-url "$R2_ENDPOINT"
          #    done || true
