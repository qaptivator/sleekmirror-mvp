name = "sleekmirror-media-gateway"
main = "src/index.ts"
compatibility_date = "2024-09-01"

# Bind your private R2 bucket
# If your bucket in Cloudflare dashboard has a different name, change bucket_name here.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "sleekmirror-storage"

# Environment variables
# Note: AUTH_SECRET should be set securely via CLI:
#   npx wrangler secret put AUTH_SECRET
[vars]
ENVIRONMENT = "production"
